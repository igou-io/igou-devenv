# Single source of truth for CLI tools in the devcontainer Dockerfile.
# See igou-docs/devenv/Devenv Design Decisions and History.md
#
# Renovate manages aqua/npm versions natively and annotated http tools via regex.
# After any version bump: `make mise-lock && make test`

[settings]
# Verification controls — defense in depth (see spec section "Supply-chain mitigations")
paranoid = true
github_attestations = true
slsa = true

# Lockfile — pin per-asset SHA256 across builds
lockfile = true
locked = true
lockfile_platforms = ["linux-x64", "linux-arm64"]

# Block freshly-published versions (xz-style attack window)
minimum_release_age = "10d"

# Refuse to load any mise.toml outside this allowlist (defense against
# workspace-mounted malicious mise.toml at container runtime)
trusted_config_paths = ["/etc/mise/mise.toml"]

[settings.npm]
# Shell out to real npm instead of mise's bundled aube resolver. aube (mise
# >= 2026.7.11, still broken in 2026.8.0) fails with "failed to resolve
# dependencies" on t3's dep @pierre/diffs: old published versions of that
# package leaked pnpm `catalog:` specifiers into their packument, aube parses
# the full packument strictly and dies, npm ignores the unrelated versions.
# npm >= 11.16.0 (node 26 bundles 11.17) still honors allow_builds via
# per-package script approvals, so the node-pty allow_builds scoping in
# [tools."npm:t3"] keeps working. Verified: node-pty builds and spawns a PTY.
package_manager = "npm"

[settings.aqua]
# Aqua-backend verification (defaults are true but pinned here for documentation
# and audit trail). The audit test in tests/test-mise.sh asserts that each
# tool resolves to its expected verification method.
cosign = true
slsa = true
minisign = true
github_attestations = true
# Pin upstream registry to a release commit. Renovate updates the tag and SHA; PR review
# + tests/test-mise.sh audit catch verification downgrades.
# renovate: datasource=github-tags depName=aquaproj/aqua-registry
registry_url = "https://raw.githubusercontent.com/aquaproj/aqua-registry/c970a7a900bef7ab37210cfc5ad26ab488331212/registry.yaml" # v4.575.0

[tool_alias]
# npm: backend tools (t3) declare a dependency on a tool literally named
# `node` — mise builds the npm/node PATH for their install from that tool
# alone (.full_env, not the ambient PATH), so a backend-prefixed
# "aqua:nodejs/node" key is invisible to them and npm spawns fail with a
# bare ENOENT. Aliasing keeps the aqua-registry install path (and its
# lockfile pin) while exposing the tool under the name the npm backend needs.
node = "aqua:nodejs/node"

[tools]
# Canary tool — proves the integration shape end-to-end before adding the rest.
kubectl = "1.37.1"

# Task 2.1 — SHA256-verified tools (aqua-registry per-tool checksums.txt).
gh = "2.102.1"
kustomize = "5.8.3"
kubeseal = "0.40.0"
kubeconform = "0.8.0"
kind = "0.33.0"
act = "0.2.92"
tekton-cli = "0.46.1"   # binary is `tkn`; mise registry key is tekton-cli
# Pipelines-as-Code CLI (binary: tkn-pac). No short alias in mise's registry,
# so use the explicit aqua: key form.
"aqua:tektoncd/pipelines-as-code" = "0.52.0"
rclone = "1.75.2"
direnv = "2.38.2"
age = "1.3.2"
# node — `core:node` does not record per-platform checksums in mise.lock, so
# `locked = true` rejects it. Using aqua-registry's nodejs/node entry instead,
# via the [tool_alias] mapping above so npm: backend tools resolve their
# `node` dependency; upstream provides no SHASUMS in the aqua definition, so
# mise falls back to blake3 TOFU (strictly better than the prior unverified
# `curl | tar`).
node = "26.12.1"

# SLSA signer pins match the Fulcio URI and issuer in these projects' release
# provenance. Keep the exact generator ref; a publisher changing its signer
# must fail verification until that change is reviewed.
[tools.flux2]
version = "2.9.6"
slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
slsa_signer_issuer = "https://token.actions.githubusercontent.com"

[tools.sops]
version = "3.13.3"
slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
slsa_signer_issuer = "https://token.actions.githubusercontent.com"

[tools.argocd]
version = "3.5.6"
slsa_signer_identity = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"
slsa_signer_issuer = "https://token.actions.githubusercontent.com"

# Task 2.3 / follow-up — GPG-verified tools. aqua-registry's mise install path
# records only sha256 for helm + terraform (no GPG step), so the previous
# inline GPG verification would have been a downgrade if left as-is. Restored
# via postinstall hooks: each script re-runs the same trust-anchor flow the
# inline Dockerfile blocks did (fetch upstream KEYS, assert pinned fingerprint,
# verify detached signature on either the tarball itself or the SHA256SUMS
# file, then confirm sha matches). The audit ("postinstall-gpg" in
# tests/mise-expected-verification.toml) asserts the hook is wired and
# references gpg, so the script can't be silently dropped on a future bump.

[tools.helm]
version = "4.3.1"
postinstall = "/etc/mise/aqua-registry/helm-postinstall.sh"

[tools.terraform]
version = "1.16.6"
postinstall = "/etc/mise/aqua-registry/terraform-postinstall.sh"

# Task 3.1 — off-registry tools via mise's http backend.
# Not in aqua-registry; we provide per-platform URLs directly and let mise
# pin a blake3 TOFU checksum in mise.lock (same trust floor as the prior
# inline `curl | sha256sum -c` blocks, which also captured a single sha
# upstream once and trusted it thereafter).
#
# Note: http-backend tools cannot use the `tool = "version"` shorthand
# because we need to attach a `[tools."http:<name>".platforms]` table —
# TOML forbids extending a string value with dotted keys. Use a table
# form for each instead.

# renovate: datasource=github-releases depName=kubevirt/kubevirt
[tools."http:virtctl"]
version = "1.9.1"

[tools."http:virtctl".platforms]
linux-x64   = { url = "https://github.com/kubevirt/kubevirt/releases/download/v{{ version }}/virtctl-v{{ version }}-linux-amd64" }
linux-arm64 = { url = "https://github.com/kubevirt/kubevirt/releases/download/v{{ version }}/virtctl-v{{ version }}-linux-arm64" }

# OpenShell CLI. NVIDIA publishes static Linux archives plus an unsigned
# SHA256 checksum manifest, but OpenShell is not in aqua-registry and mise's
# http backend does not consume that manifest. The lockfile therefore pins the
# downloaded archives with the same blake3 TOFU floor as the other http tools.
# The global minimum_release_age gate still applies.
# renovate: datasource=github-releases depName=NVIDIA/OpenShell
[tools."http:openshell"]
version = "0.1.5"

[tools."http:openshell".platforms]
linux-x64   = { url = "https://github.com/NVIDIA/OpenShell/releases/download/v{{ version }}/openshell-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { url = "https://github.com/NVIDIA/OpenShell/releases/download/v{{ version }}/openshell-aarch64-unknown-linux-musl.tar.gz" }

# Task 3.2 — oc (OpenShift CLI). mise's http backend gives the same blake3
# TOFU floor as the rest of the http: tools, plus a postinstall hook that
# independently re-verifies Red Hat's GPG-signed sha256sum.txt.gpg against
# the pinned trust anchor 567E347AD0044ADE55BA8A5F199E2F91FD431D51. The
# downgrade we'd otherwise take by abandoning the inline block is avoided.
# renovate: datasource=custom.openshift-mirror depName=oc
[tools."http:oc"]
version = "4.21.37"
postinstall = "/etc/mise/aqua-registry/oc-postinstall.sh"

[tools."http:oc".platforms]
linux-x64   = { url = "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ version }}/openshift-client-linux.tar.gz" }
linux-arm64 = { url = "https://mirror.openshift.com/pub/openshift-v4/aarch64/clients/ocp/{{ version }}/openshift-client-linux.tar.gz" }

# t3 (T3 Code) — local web GUI for the coding-agent CLIs already in this image
# (claude, codex, opencode, cursor-agent); served always-on by
# .devcontainer/post-start.sh. npm-only distribution
# with runtime deps (incl. native node-pty), so the http-tarball form can't
# work — the npm backend runs `npm install`, which verifies each package
# against the registry's per-tarball sha512 integrity metadata. That
# verification happens inside npm and is not recorded in mise.lock (the entry
# is version+backend only, like core:), so the audit value is "npm" in
# tests/mise-expected-verification.toml. `locked = true` still pins the exact
# version fail-closed. Depends on `node` above (the [tool_alias] name is what
# lets the npm backend find node/npm at resolve and install time).
#
# allow_builds: mise defaults npm installs to --ignore-scripts, but node-pty
# (t3's terminal layer) ships no linux prebuild — its install script must run
# node-gyp, or `t3 serve` dies at startup with NodePtyModuleLoadError. Scoped
# to that one package; every other dependency's lifecycle scripts stay
# blocked. The build needs gcc-c++/make/python3 (present in the Dockerfile
# layer and the bin/run-pinned-mise bootstrap).
[tools."npm:t3"]
version = "0.1.6"
# Keep fresh t3 releases and their npm dependencies available immediately.
minimum_release_age = "0s"
allow_builds = ["node-pty"]

# rustfs-cli — the `rc` admin/client CLI for RustFS S3 servers. Only the RustFS
# *server* (github:rustfs/rustfs) is in aqua-registry; the CLI is not, so it
# uses the http backend like the other off-registry tools above. Upstream ships
# per-asset .sha256 + SHA256SUMS but NO GPG signature, SLSA provenance, or
# gh-attestation (checked 2026-07 against v0.1.25), so the http backend's blake3
# TOFU pin in mise.lock is the strongest verification available — the same trust
# floor accepted for virtctl. The global
# minimum_release_age = "10d" gate still applies.
#
# The gnu (glibc) artifacts match the Fedora devcontainer. The tarball
# is a flat archive whose single binary is named `rc` (not rustfs-cli), so no
# strip_components/bin_path is needed and the launch-check binary override in
# tests/mise-expected-verification.toml points at `rc`.
# renovate: datasource=github-releases depName=rustfs/cli
[tools."http:rustfs-cli"]
version = "0.1.36"

[tools."http:rustfs-cli".platforms]
linux-x64   = { url = "https://github.com/rustfs/cli/releases/download/v{{ version }}/rustfs-cli-linux-amd64-gnu-v{{ version }}.tar.gz" }
linux-arm64 = { url = "https://github.com/rustfs/cli/releases/download/v{{ version }}/rustfs-cli-linux-arm64-gnu-v{{ version }}.tar.gz" }

# gws — Google Workspace CLI (googleworkspace/cli). Not in aqua-registry, so it
# uses the http backend like the other off-registry tools above. Upstream ships
# per-asset .sha256 files and GitHub artifact attestations (checked 2026-07
# against v0.22.5), but the http backend consumes neither — the blake3 TOFU pin
# in mise.lock is the floor, same as virtctl/rustfs-cli. The global
# minimum_release_age = "10d" gate still applies.
#
# The gnu (glibc) artifacts match the Fedora devcontainer. The tarball
# is a flat archive whose single binary is named `gws`, so no strip_components/
# bin_path is needed; the launch check in tests/mise-expected-verification.toml
# runs `gws` directly.
# renovate: datasource=github-releases depName=googleworkspace/cli
[tools."http:gws"]
version = "0.22.5"

[tools."http:gws".platforms]
linux-x64   = { url = "https://github.com/googleworkspace/cli/releases/download/v{{ version }}/google-workspace-cli-x86_64-unknown-linux-gnu.tar.gz" }
linux-arm64 = { url = "https://github.com/googleworkspace/cli/releases/download/v{{ version }}/google-workspace-cli-aarch64-unknown-linux-gnu.tar.gz" }
