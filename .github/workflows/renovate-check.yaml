name: Renovate coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
      - renovate-base.json
      - mise.toml
      - tests/test-renovate.mjs
      - .github/workflows/renovate-check.yaml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: docker.io/renovate/renovate:44.148.3@sha256:69e3c20b19f901ca7b02f609216d5ccf0fa700387001f099817852da3dfb617c
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate repository and shared preset
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: renovate-config-validator renovate.json renovate-base.json
      - name: Check extraction, replacements, handoff, and release timestamps
        run: node tests/test-renovate.mjs
