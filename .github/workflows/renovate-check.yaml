name: Renovate coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
      - renovate-base.json
      - mise.toml
      - .devcontainer/devcontainer.json
      - .github/scripts/vscode-extension-releases.mjs
      - tests/test-renovate.mjs
      - .github/workflows/renovate-check.yaml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    container:
      image: docker.io/renovate/renovate:44.198.0@sha256:15ee7727b68a54cae567171dcf14f279023c110da5825d85fdfb2b4c5751c5aa
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate repository and shared preset
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: renovate-config-validator renovate.json renovate-base.json
      - name: Check extraction, replacements, handoff, and release timestamps
        run: node tests/test-renovate.mjs
